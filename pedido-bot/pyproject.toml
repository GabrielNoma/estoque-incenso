[project]
name = "pedido"
version = "0.1.0"
description = "Pedido a partir de mensagem de WhatsApp (intake -> Excel)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "langchain-core",
    "langchain-anthropic",
    "rapidfuzz",
    "openpyxl",
    "psycopg[binary]",
    "langchain-openai",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
