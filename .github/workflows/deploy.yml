name: Test and Deploy

# Um repositório, dois serviços no Render: o estoque (Node + Angular) e o bot de pedidos (Python).
# Cada parte só roda quando a pasta dela muda. Em pull requests só testa; o deploy só acontece em push no main.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      estoque: ${{ steps.filtro.outputs.estoque }}
      bot: ${{ steps.filtro.outputs.bot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar o que mudou
        id: filtro
        uses: dorny/paths-filter@v3
        with:
          filters: |
            estoque:
              - 'estoque-incenso/**'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/**'
            bot:
              - 'pedido-bot/**'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/**'

  estoque:
    needs: mudancas
    if: needs.mudancas.outputs.estoque == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estoque_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estoque_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inicializar banco de testes
        run: psql $DATABASE_URL -f estoque-incenso/backend/src/db/schema.sql

      - name: Instalar dependências do backend
        working-directory: estoque-incenso/backend
        run: npm ci

      - name: Rodar testes
        working-directory: estoque-incenso/backend
        run: npm test

      - name: Instalar dependências do frontend
        working-directory: estoque-incenso/frontend
        run: npm ci --include=dev

      - name: Build Angular
        working-directory: estoque-incenso/frontend
        run: npm run build

      - name: Trigger Render Deploy Hook (estoque)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          NOME_SECRET: RENDER_DEPLOY_HOOK_URL
        run: bash .github/scripts/disparar-deploy-render.sh

  bot:
    needs: mudancas
    if: needs.mudancas.outputs.bot == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # com a extensão pgvector, que o bot exige
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: pedido-bot

    env:
      # os testes criam o próprio banco (pedido_test) e precisam de um usuário que crie bancos e extensões
      PEDIDO_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pedido-bot/uv.lock

      - name: Instalar dependências do bot
        run: uv sync --frozen

      - name: Rodar testes do bot
        run: uv run pytest -q

      - name: Construir a imagem do container (verifica o Dockerfile)
        run: docker build -t pedido-bot:ci .

      - name: Aplicar migrações no banco de produção
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # conexão que aceita DDL (pooler de sessão ou direta do Supabase); só neste passo e só no main
          DATABASE_URL: ${{ secrets.BOT_DATABASE_URL_MIGRACAO }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Migrações::Secret BOT_DATABASE_URL_MIGRACAO não configurado: migrações NÃO aplicadas. Aplique com 'python -m pedido.migrate' antes do deploy."
          else
            uv run python -m pedido.migrate
          fi

      - name: Trigger Render Deploy Hook (bot)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_BOT }}
          NOME_SECRET: RENDER_DEPLOY_HOOK_URL_BOT
        run: bash .github/scripts/disparar-deploy-render.sh
